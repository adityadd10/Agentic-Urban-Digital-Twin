[project]
name = "mtp-udt"
version = "0.1.0"
description = "Agentic Urban Digital Twin — MTP"
authors = [
    { name = "Aditya Darshan Dewanjee", email = "adityadd2000@gmail.com" }
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "numpy>=1.26,<2",
    "structlog>=24.4,<25",
    "pyyaml>=6.0,<7",
    "networkx>=3.3,<4",
    "httpx>=0.27,<1",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "rasterio>=1.3,<2",
    "scipy>=1.13,<2",
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.3,<3",
    "torch>=2.2,<3",
    "tensorboard>=2.16,<3",
    "pettingzoo>=1.24,<2",
    "langgraph>=1.2,<2",
    "anthropic>=1.5,<2",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "pytest-benchmark>=4.0,<5",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
    "types-pyyaml>=6.0,<7",
    "types-networkx>=3.2,<4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "udt"

# --------------------------------------------------------------------------
# ruff — lint + format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["udt"]

# --------------------------------------------------------------------------
# mypy — strict on the core packages named in the dev doc (§12.2); other
# packages join this list as they gain real code in later modules.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = [
    "udt.twin",
    "udt.envs",
    "udt.common",
    "udt.risk",
    "udt.incidents",
    "udt.scenarios",
    "udt.constraints",
    "udt.llm",
    "udt.routing",
    "udt.logging",
    "udt.api",
]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# No py.typed marker upstream (as of the pinned version) — geo stack, not
# worth hand-writing stubs for a data-pipeline dependency.
module = "rasterio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same rationale as rasterio above — added when `twin/ambulances.py`
# (M4's ambulance-dispatch slice) started using shapely's `Point`/
# `Polygon` directly instead of only through `geopandas`.
module = "shapely.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same rationale as rasterio/shapely above — added for `envs/
# multi_env.py` (M6a). Unlike gymnasium (which ships py.typed and full
# stubs), PettingZoo doesn't, as of the pinned version.
module = "pettingzoo.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest — markers registered up front so `pytest -m phase<n>` never warns
# about unregistered markers as later modules add their tests.
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "phase0: scaffolding",
    "phase1: twin core",
    "phase2: data pipeline",
    "phase3: incidents + scenarios",
    "phase4: rule-based baseline + harness",
    "phase5: single-agent RL",
    "phase6: MARL",
    "phase7: constraint engine + constrained MARL",
    "phase8: risk engine",
    "phase9: LLM layer + router",
    "phase10: full integration + UI",
    "phase11: evaluation + ablations",
    "slow: slow-running tests (e.g. learning smoke tests), excluded by default in CI fast lane",
]
