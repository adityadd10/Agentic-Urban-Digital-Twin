# Constraint engine config (dev doc §8, module M7). Documents each rule in
# the dev doc's own notation for reference/logging — the actual check logic
# is a registered Python callable per `id`, in `udt/constraints/engine.py`
# (a function-registry, not an expression-language parser for the `rule:`
# strings below; see that module's docstring for why). This file is *not*
# read by `engine.py` at runtime — it's the human-readable spec the code is
# checked against, same relationship `MTP_Development_Document.md` has to
# every other module in this codebase.
#
# `on_violation` is one of the dev doc's three repair verbs: clip (reduce
# magnitude) | drop (remove that one sub-action) | reject (replace the
# whole action with a no-op) — evaluated in the order listed here.

- id: bed_capacity
  scope: health
  rule: "transfers_in[h] <= beds_free[h]"
  on_violation: clip
  implemented: true

- id: route_flood_safety
  scope: transport
  rule: "route_max_flood_depth[a] < 0.4"
  on_violation: drop
  implemented: true

- id: power_balance
  scope: power
  rule: "allocated_mw[s] <= capacity_mw[s] * functional_level[s]"
  on_violation: clip
  implemented: false
  # Disclosed gap, not silently dropped: no `allocated_mw` decision
  # variable exists in this build (only `shed_tier`, a discrete tier
  # choice, not a continuous MW allocation this rule's text is written
  # against) — see engine.py's `_check_power_balance` docstring.
